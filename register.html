
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: url('https://img.freepik.com/free-photo/particle-lines-futuristic-gradient-background_53876-104053.jpg?semt=ais_hybrid') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 2px solid #ccc;
      border-radius: 5px;
      background-color: #f9f9f9;
      box-sizing: border-box;
    }

    input:focus {
      border-color: #007bff;
      outline: none;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
    }

    button {
      background-color: #007bff;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    button:hover {
      background-color: #0056b3;
    }

    button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }

    #error-message {
      color: red;
      text-align: center;
      margin-top: 15px;
      overflow-wrap: anywhere;
    }

    .login-link {
      text-align: center;
      margin-top: 15px;
    }

    .login-link a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }

    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Sign Up</h1>

    <form id="registerForm" autocomplete="off">

      <label for="name">Name:</label>
      <input
        type="text"
        id="name"
        name="username"
        required
        autocomplete="name"
      />

      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        required
        autocomplete="email"
      />

      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        required
        autocomplete="new-password"
      />

      <button type="submit" id="registerButton">
        Sign Up
      </button>

      <p id="error-message" role="status"></p>

    </form>

    <p class="login-link">
      Already have an account?
      <a href="log.html">Log in here</a>
    </p>

  </div>

  <script>
    const registerForm = document.getElementById('registerForm');
    const errorMessage = document.getElementById('error-message');
    const registerButton = document.getElementById('registerButton');

    registerForm.addEventListener('submit', handleRegister);

    async function handleRegister(event) {
      event.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      errorMessage.textContent = '';

      if (!name || !email || !password) {
        errorMessage.textContent = 'All fields are required!';
        return;
      }

      registerButton.disabled = true;
      registerButton.textContent = 'Registering...';

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            username: name,
            email: email,
            password: password
          })
        });

        const data = await response.json();

        if (response.ok) {
          alert('Registration successful! Redirecting to login...');

          window.location.href = 'log.html';
        } else {
          errorMessage.textContent =
            data.error || 'Registration failed. Try again.';
        }

      } catch (error) {
        console.error('Registration error:', error);

        errorMessage.textContent =
          'Unable to connect to the server. Please try again.';
      } finally {
        registerButton.disabled = false;
        registerButton.textContent = 'Sign Up';
      }
    }
  </script>

</body>
</html>
